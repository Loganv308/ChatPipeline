services:
  collector:
    build: .
    command: ["python", "src/Worker.py"]
    restart: always
    env_file: .env
    environment:
      LOCAL_BUFFER_PATH: /data/buffer.db
    volumes:
      - chatbuffer:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # rotate logs at 10MB
        max-file: "3"     # keep last 3 log files
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sync:
    build: .
    command: ["python", "src/Sync.py"]
    restart: always
    env_file: .env
    environment:
      LOCAL_BUFFER_PATH: /data/buffer.db
    volumes:
      - chatbuffer:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  # Shared between both services so they see the same SQLite buffer.
  # Named volume survives container restarts/rebuilds; the collector
  # writes here, sync reads/drains it, independent of each other.
  chatbuffer: